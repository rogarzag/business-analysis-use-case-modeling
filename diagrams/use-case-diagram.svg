<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Use case diagram for a prime-time news program</title>
  <desc id="desc">Original Lucidchart model: five actors outside the News channel program system boundary, six use cases inside, and eight actor-to-use-case associations.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16b9a8"/>
    </marker>
    <style>
      .system { fill:#fff; stroke:#a7a7a7; stroke-width:2; }
      .system-title { font: 27px Arial, sans-serif; fill:#1680f5; text-anchor:middle; }
      .actor { fill:none; stroke:#4c91f5; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
      .actor-label { font: 16px Arial, sans-serif; fill:#444; text-anchor:middle; }
      .usecase { fill:#e1e5e9; stroke:#777e84; stroke-width:1.5; }
      .usecase-label { font: 16px Arial, sans-serif; fill:#3f4449; text-anchor:middle; }
      .association { fill:none; stroke:#16b9a8; stroke-width:1.8; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#fff"/>
  <rect x="300" y="80" width="600" height="660" class="system"/>
  <text x="600" y="122" class="system-title">News channel program</text>

  <!-- Actor-to-use-case associations, following the original Lucidchart diagram -->
  <g class="association">
    <path d="M168 230 H375"/>
    <path d="M168 185 H700 V182"/>
    <path d="M1032 230 H825"/>
    <path d="M1032 255 H500 V278"/>
    <path d="M168 430 H375"/>
    <path d="M168 475 L375 630"/>
    <path d="M1032 430 H825"/>
    <path d="M1032 630 H825"/>
  </g>

  <!-- System use cases -->
  <g>
    <ellipse cx="500" cy="230" rx="125" ry="48" class="usecase"/>
    <text x="500" y="224" class="usecase-label">
      <tspan x="500">Produce a news</tspan><tspan x="500" dy="21">segment</tspan>
    </text>

    <ellipse cx="700" cy="230" rx="125" ry="48" class="usecase"/>
    <text x="700" y="236" class="usecase-label">Broadcast live news</text>

    <ellipse cx="500" cy="430" rx="125" ry="48" class="usecase"/>
    <text x="500" y="436" class="usecase-label">View the program</text>

    <ellipse cx="700" cy="430" rx="125" ry="48" class="usecase"/>
    <text x="700" y="424" class="usecase-label">
      <tspan x="700">Manage broadcasting</tspan><tspan x="700" dy="21">equipment</tspan>
    </text>

    <ellipse cx="500" cy="630" rx="125" ry="48" class="usecase"/>
    <text x="500" y="624" class="usecase-label">
      <tspan x="500">Engage through</tspan><tspan x="500" dy="21">social media</tspan>
    </text>

    <ellipse cx="700" cy="630" rx="125" ry="48" class="usecase"/>
    <text x="700" y="636" class="usecase-label">Provide advertising</text>
  </g>

  <!-- News producer -->
  <g class="actor">
    <circle cx="125" cy="165" r="19"/>
    <path d="M125 184 V255 M82 205 H168 M125 255 L85 305 M125 255 L165 305"/>
  </g>
  <text x="125" y="332" class="actor-label">News producer</text>

  <!-- Reporter -->
  <g class="actor">
    <circle cx="1075" cy="165" r="19"/>
    <path d="M1075 184 V255 M1032 205 H1118 M1075 255 L1035 305 M1075 255 L1115 305"/>
  </g>
  <text x="1075" y="332" class="actor-label">Reporter</text>

  <!-- Viewer -->
  <g class="actor">
    <circle cx="125" cy="365" r="19"/>
    <path d="M125 384 V455 M82 405 H168 M125 455 L85 505 M125 455 L165 505"/>
  </g>
  <text x="125" y="532" class="actor-label">Viewer</text>

  <!-- Technical team -->
  <g class="actor">
    <circle cx="1075" cy="365" r="19"/>
    <path d="M1075 384 V455 M1032 405 H1118 M1075 455 L1035 505 M1075 455 L1115 505"/>
  </g>
  <text x="1075" y="532" class="actor-label">Technical team</text>

  <!-- Advertiser -->
  <g class="actor">
    <circle cx="1075" cy="565" r="19"/>
    <path d="M1075 584 V655 M1032 605 H1118 M1075 655 L1035 705 M1075 655 L1115 705"/>
  </g>
  <text x="1075" y="732" class="actor-label">Advertiser</text>
</svg>